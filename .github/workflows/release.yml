name: GitHub Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  wait-for-docker:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Docker build to complete
        uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ github.ref }}
          check-name: 'build'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 30
          allowed-conclusions: success,failure,cancelled

  build-assets:
    runs-on: ubuntu-latest
    needs: wait-for-docker
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: pnpm build

      - name: Create distribution package
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          PACKAGE_DIR="xiaozhi-mcphub-v$VERSION"
          mkdir -p "$PACKAGE_DIR"
          
          # 复制构建产物
          cp -r dist "$PACKAGE_DIR/"
          cp -r frontend/dist "$PACKAGE_DIR/frontend-dist"
          
          # 复制必要文件
          cp package.json pnpm-lock.yaml "$PACKAGE_DIR/"
          cp README.md README.zh.md LICENSE "$PACKAGE_DIR/"
          cp docker-compose.yml Dockerfile entrypoint.sh "$PACKAGE_DIR/"
          cp nginx.conf.example servers.json "$PACKAGE_DIR/"
          
          # 创建安装脚本
          cat > "$PACKAGE_DIR/install.sh" << 'EOF'
          #!/bin/bash
          echo "小智 MCP Hub v$VERSION 安装脚本"
          echo "请确保已安装 Node.js 20+ 和 pnpm"
          echo ""
          echo "1. 安装依赖: pnpm install --prod"
          echo "2. 启动服务: pnpm start"
          echo "3. 或使用 Docker: docker-compose up -d"
          EOF
          chmod +x "$PACKAGE_DIR/install.sh"
          
          # 打包（保持目录结构）
          tar -czf xiaozhi-mcphub-v$VERSION.tar.gz "$PACKAGE_DIR"
          zip -r xiaozhi-mcphub-v$VERSION.zip "$PACKAGE_DIR"

      - name: Generate changelog
        id: changelog
        run: |
          set -euo pipefail
          VERSION=${GITHUB_REF#refs/tags/v}
          REPO="${{ github.repository }}"
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          # Bilingual body required by scripts/validate-release-notes.js
          # (Summary / 摘要 / References are mandatory; Features/Fixes pairs optional).
          {
            echo "## Summary"
            echo ""
            if [ -n "$PREV_TAG" ]; then
              echo "xiaozhi-mcphub \`$VERSION\` — changes since \`$PREV_TAG\`. Docker images \`huangjunsen/xiaozhi-mcphub:$VERSION\` and \`:latest\` (linux/amd64, linux/arm64)."
            else
              echo "xiaozhi-mcphub \`$VERSION\` initial tagged release. Docker images \`huangjunsen/xiaozhi-mcphub:$VERSION\` and \`:latest\` (linux/amd64, linux/arm64)."
            fi
            echo ""
            echo "## Features"
            echo ""
            if [ -n "$PREV_TAG" ]; then
              git log --pretty=format:"- %s ([%h](https://github.com/$REPO/commit/%H))" "$PREV_TAG"..HEAD \
                | rg -i '^\- (feat|feature)[:(/ ]' || true
              # Ensure section is non-empty for validators that reject blank optional sections
              if ! git log --pretty=format:"%s" "$PREV_TAG"..HEAD | rg -qi '^(feat|feature)[:(/ ]'; then
                echo "- See commit history in References."
              fi
            else
              echo "- Initial release of xiaozhi-mcphub."
            fi
            echo ""
            echo "## Fixes"
            echo ""
            if [ -n "$PREV_TAG" ]; then
              git log --pretty=format:"- %s ([%h](https://github.com/$REPO/commit/%H))" "$PREV_TAG"..HEAD \
                | rg -i '^\- (fix)[:(/ ]' || true
              if ! git log --pretty=format:"%s" "$PREV_TAG"..HEAD | rg -qi '^fix[:(/ ]'; then
                echo "- See commit history in References."
              fi
            else
              echo "- N/A"
            fi
            echo ""
            echo "## 摘要"
            echo ""
            if [ -n "$PREV_TAG" ]; then
              echo "xiaozhi-mcphub \`$VERSION\`（自 \`$PREV_TAG\` 起的变更）。Docker 镜像 \`huangjunsen/xiaozhi-mcphub:$VERSION\` 与 \`:latest\`（linux/amd64、linux/arm64）。"
            else
              echo "xiaozhi-mcphub \`$VERSION\` 首次打 tag 发布。Docker 镜像 \`huangjunsen/xiaozhi-mcphub:$VERSION\` 与 \`:latest\`（linux/amd64、linux/arm64）。"
            fi
            echo ""
            echo "## 功能"
            echo ""
            if [ -n "$PREV_TAG" ]; then
              git log --pretty=format:"- %s ([%h](https://github.com/$REPO/commit/%H))" "$PREV_TAG"..HEAD \
                | rg -i '^\- (feat|feature)[:(/ ]' || true
              if ! git log --pretty=format:"%s" "$PREV_TAG"..HEAD | rg -qi '^(feat|feature)[:(/ ]'; then
                echo "- 详见 References 中的提交记录。"
              fi
            else
              echo "- xiaozhi-mcphub 首次发布。"
            fi
            echo ""
            echo "## 修复"
            echo ""
            if [ -n "$PREV_TAG" ]; then
              git log --pretty=format:"- %s ([%h](https://github.com/$REPO/commit/%H))" "$PREV_TAG"..HEAD \
                | rg -i '^\- (fix)[:(/ ]' || true
              if ! git log --pretty=format:"%s" "$PREV_TAG"..HEAD | rg -qi '^fix[:(/ ]'; then
                echo "- 详见 References 中的提交记录。"
              fi
            else
              echo "- 无"
            fi
            echo ""
            echo "## References"
            echo ""
            if [ -n "$PREV_TAG" ]; then
              echo "- Full changelog: https://github.com/$REPO/compare/$PREV_TAG...v$VERSION"
              echo "- Commits:"
              git log --pretty=format:"  - %s ([%h](https://github.com/$REPO/commit/%H))" "$PREV_TAG"..HEAD
              echo ""
            else
              echo "- Release tag: https://github.com/$REPO/releases/tag/v$VERSION"
            fi
            echo ""
            echo "## Docker Images"
            echo ""
            echo "- **Version**: \`huangjunsen/xiaozhi-mcphub:$VERSION\`"
            echo "- **Latest**: \`huangjunsen/xiaozhi-mcphub:latest\`"
            echo "- Architectures: \`linux/amd64\`, \`linux/arm64\`"
            echo ""
            echo "## Quick Start"
            echo ""
            echo "\`\`\`bash"
            echo "docker pull huangjunsen/xiaozhi-mcphub:$VERSION"
            echo "# or"
            echo "docker pull huangjunsen/xiaozhi-mcphub:latest"
            echo "\`\`\`"
          } > CHANGELOG.md

          # Validate before publishing so Release notes workflow stays green
          node scripts/validate-release-notes.js CHANGELOG.md

          {
            echo 'CHANGELOG<<EOF'
            cat CHANGELOG.md
            echo EOF
          } >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "${{ github.ref_name }}"
          body: ${{ steps.changelog.outputs.CHANGELOG }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            xiaozhi-mcphub-v*.tar.gz
            xiaozhi-mcphub-v*.zip
          generate_release_notes: false