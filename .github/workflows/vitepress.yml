# Deploy VitePress docs (documents/) to GitHub Pages
name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'documents/**'
      - '.github/workflows/vitepress.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Enable corepack
        run: corepack enable
        continue-on-error: true

      - name: Install pnpm
        run: npm install -g pnpm@10

      # Root pnpm-workspace / monorepo layout can skip installing documents/
      # node_modules; --ignore-workspace forces a real local install.
      - name: Install documentation dependencies
        working-directory: documents
        run: pnpm install --ignore-workspace --frozen-lockfile=false

      - name: Build VitePress site
        working-directory: documents
        run: pnpm docs:build

      - name: Deploy to gh-pages
        uses: crazy-max/ghaction-github-pages@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          target_branch: gh-pages
          build_dir: documents/docs/.vitepress/dist
