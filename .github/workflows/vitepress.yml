# Deploy VitePress docs (documents/) to GitHub Pages
name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'documents/**'
      - '.github/workflows/vitepress.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Version comes from package.json "packageManager" (do not also set version here).
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: documents/pnpm-lock.yaml

      # Root layout can skip documents/node_modules; force a local install.
      - name: Install documentation dependencies
        working-directory: documents
        run: pnpm install --ignore-workspace --frozen-lockfile=false

      - name: Build VitePress site
        working-directory: documents
        run: pnpm docs:build

      - name: Deploy to gh-pages
        uses: crazy-max/ghaction-github-pages@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          target_branch: gh-pages
          build_dir: documents/docs/.vitepress/dist
